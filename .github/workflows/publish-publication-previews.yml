name: Publish publication previews

on:
  workflow_run:
    workflows: [Build publication previews]
    types: [requested, completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

# Only the default branch's publisher runs with write permissions. It never
# executes pull-request code; downloaded artifacts are read as PDF data only.
permissions:
  actions: read
  contents: write
  pull-requests: write
  pages: write
  id-token: write

# Each run reconciles every open PR, including events replaced in this queue.
concurrency:
  group: publication-preview-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Prepare latest previews and update build status
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const previews = require('./.github/scripts/publication-previews.cjs');
            await previews.prepare({ github, context, core });
      - uses: actions/upload-pages-artifact@v3
        if: steps.prepare.outputs.deploy == 'true'
        with:
          path: .preview-site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.prepare.outputs.deploy == 'true'
      - name: Link deployed PDFs
        if: success()
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const previews = require('./.github/scripts/publication-previews.cjs');
            await previews.finish({ github, context, core });
      - name: Report publishing failure
        if: failure() && steps.prepare.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const previews = require('./.github/scripts/publication-previews.cjs');
            await previews.finish({ github, context, core, failed: true });
